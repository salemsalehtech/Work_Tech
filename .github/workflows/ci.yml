name: CI

# Manual only while GitHub Actions is unavailable on this account.
# The same checks run locally in .husky/pre-push before every push.
# To re-enable, restore:
#   pull_request:
#   push:
#     branches: [main, develop]
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run build
